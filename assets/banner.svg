<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="40%" stop-color="#111827" />
      <stop offset="80%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7df1e" />
      <stop offset="50%" stop-color="#3178c6" />
      <stop offset="100%" stop-color="#f05032" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1a202c" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .grid-line { stroke: #ffffff; stroke-opacity: 0.04; stroke-width: 1; }
    
    /* Dynamic Animated Background Orbits */
    @keyframes floatParticle1 {
      0% { transform: translate(0px, 0px) scale(1); opacity: 0.2; }
      50% { transform: translate(80px, 40px) scale(1.3); opacity: 0.5; }
      100% { transform: translate(0px, 0px) scale(1); opacity: 0.2; }
    }
    @keyframes floatParticle2 {
      0% { transform: translate(0px, 0px) scale(1.2); opacity: 0.3; }
      50% { transform: translate(-70px, -35px) scale(0.9); opacity: 0.6; }
      100% { transform: translate(0px, 0px) scale(1.2); opacity: 0.3; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; }
      50% { opacity: 0.8; }
      100% { opacity: 0.4; }
    }
    @keyframes spinFlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }

    .particle-1 { animation: floatParticle1 12s ease-in-out infinite; }
    .particle-2 { animation: floatParticle2 16s ease-in-out infinite; }
    .pulse-glow { animation: pulseGlow 6s ease-in-out infinite; }
    .stream-line { stroke-dasharray: 8 12; animation: dashMove 2.5s linear infinite; }
    
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .title-highlight {
      fill: #f7df1e;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 20px;
      fill: #cbd5e1;
      letter-spacing: 0.3px;
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #94a3b8;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" class="bg" />

  <!-- Background Decorative Grid Lines -->
  <g class="grid-line">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Background Dynamic Glowing Nodes & Particle Orbs -->
  <g class="particle-1">
    <circle cx="160" cy="90" r="130" fill="#f7df1e" opacity="0.12" filter="url(#glow)" />
    <circle cx="1020" cy="110" r="140" fill="#3178c6" opacity="0.18" filter="url(#glow)" />
  </g>
  <g class="particle-2">
    <circle cx="600" cy="310" r="150" fill="#f05032" opacity="0.14" filter="url(#glow)" />
    <circle cx="920" cy="280" r="90" fill="#8b5cf6" opacity="0.16" filter="url(#glow)" />
  </g>

  <!-- Dynamic Data Pipeline Stream Paths (In background behind text) -->
  <path d="M 80 180 Q 300 90, 600 180 T 1120 180" fill="none" stroke="#3178c6" stroke-width="2" opacity="0.35" class="stream-line" />
  <path d="M 80 220 Q 400 310, 750 200 T 1120 160" fill="none" stroke="#f7df1e" stroke-width="2" opacity="0.3" class="stream-line" style="animation-duration: 3.5s;" />

  <!-- Animated Pulse Rings -->
  <circle cx="1080" cy="90" r="45" fill="none" stroke="#3178c6" stroke-width="1.5" class="pulse-glow" />
  <circle cx="120" cy="270" r="35" fill="none" stroke="#f7df1e" stroke-width="1.5" class="pulse-glow" />

  <!-- Foreground Title Card / Content Layer -->
  <g transform="translate(600, 125)" text-anchor="middle">
    <!-- Main Headline with JS Accent -->
    <text class="title-text">
      Awesome <tspan class="title-highlight">JavaScript</tspan> Compilers
    </text>

    <!-- Subtitle Line -->
    <text y="50" class="subtitle-text">
      The Curated Guide to Modern Transpilers, Native Toolchains &amp; Ultra-Fast Bundlers
    </text>

    <!-- Tech Stack Pill Tags in Foreground -->
    <g transform="translate(0, 105)">
      <!-- Pill 1: Babel -->
      <g transform="translate(-360, 0)">
        <rect x="-60" y="-18" width="120" height="36" rx="18" fill="url(#badgeGrad)" stroke="#f5da55" stroke-opacity="0.4" stroke-width="1.5" />
        <text class="badge-label" y="5" text-anchor="middle">⚡ Babel</text>
      </g>
      <!-- Pill 2: SWC -->
      <g transform="translate(-215, 0)">
        <rect x="-60" y="-18" width="120" height="36" rx="18" fill="url(#badgeGrad)" stroke="#e43716" stroke-opacity="0.4" stroke-width="1.5" />
        <text class="badge-label" y="5" text-anchor="middle">🦀 SWC (Rust)</text>
      </g>
      <!-- Pill 3: esbuild -->
      <g transform="translate(-70, 0)">
        <rect x="-60" y="-18" width="120" height="36" rx="18" fill="url(#badgeGrad)" stroke="#ffcf00" stroke-opacity="0.4" stroke-width="1.5" />
        <text class="badge-label" y="5" text-anchor="middle">🐹 esbuild (Go)</text>
      </g>
      <!-- Pill 4: TypeScript -->
      <g transform="translate(75, 0)">
        <rect x="-60" y="-18" width="120" height="36" rx="18" fill="url(#badgeGrad)" stroke="#3178c6" stroke-opacity="0.4" stroke-width="1.5" />
        <text class="badge-label" y="5" text-anchor="middle">🔷 TypeScript</text>
      </g>
      <!-- Pill 5: Vite / Rollup -->
      <g transform="translate(225, 0)">
        <rect x="-65" y="-18" width="130" height="36" rx="18" fill="url(#badgeGrad)" stroke="#bd34fe" stroke-opacity="0.4" stroke-width="1.5" />
        <text class="badge-label" y="5" text-anchor="middle">⚡ Vite &amp; Rolldown</text>
      </g>
      <!-- Pill 6: Oxc & Rspack -->
      <g transform="translate(375, 0)">
        <rect x="-60" y="-18" width="120" height="36" rx="18" fill="url(#badgeGrad)" stroke="#52bd95" stroke-opacity="0.4" stroke-width="1.5" />
        <text class="badge-label" y="5" text-anchor="middle">🚀 Oxc &amp; Rspack</text>
      </g>
    </g>
  </g>

  <!-- Accent Edge Border Gradient -->
  <rect x="0" y="354" width="1200" height="6" rx="3" fill="url(#primaryGlow)" />
</svg>
