<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0e17"/><stop offset="40%" stop-color="#111827"/><stop offset="80%" stop-color="#1e1e38"/><stop offset="100%" stop-color="#0d1117"/></linearGradient><linearGradient id="primaryGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f7df1e"/><stop offset="50%" stop-color="#3178c6"/><stop offset="100%" stop-color="#f05032"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#2d3748" stop-opacity=".8"/><stop offset="100%" stop-color="#1a202c" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes floatParticle1{0%{transform:translate(0,0) scale(1);opacity:.2}50%{transform:translate(80px,40px) scale(1.3);opacity:.5}}@keyframes floatParticle2{0%{transform:translate(0,0) scale(1.2);opacity:.3}50%{transform:translate(-70px,-35px) scale(.9);opacity:.6}}@keyframes pulseGlow{0%{opacity:.4}50%{opacity:.8}}@keyframes spinFlow{0%{transform:rotate(0deg)}}@keyframes dashMove{0%{stroke-dashoffset:0}}.bg{fill:url(#bgGrad)}.grid-line{stroke:#fff;stroke-opacity:.04;stroke-width:1}.particle-1{animation:floatParticle1 12s ease-in-out infinite}.particle-2{animation:floatParticle2 16s ease-in-out infinite}.pulse-glow{animation:pulseGlow 6s ease-in-out infinite}.stream-line{stroke-dasharray:8 12;animation:dashMove 2.5s linear infinite}.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:52px;fill:#fff;letter-spacing:-.5px}.title-highlight{fill:#f7df1e}.subtitle-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;font-weight:400;font-size:20px;fill:#cbd5e1;letter-spacing:.3px}.badge-label{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,monospace;font-weight:600;font-size:13px;fill:#94a3b8}</style><rect width="1200" height="360" class="bg" rx="16"/><g class="grid-line"><line x1="0" x2="1200" y1="60" y2="60"/><line x1="0" x2="1200" y1="120" y2="120"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="300" y2="300"/><line x1="200" x2="200" y1="0" y2="360"/><line x1="400" x2="400" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="800" x2="800" y1="0" y2="360"/><line x1="1000" x2="1000" y1="0" y2="360"/></g><g class="particle-1"><circle cx="160" cy="90" r="130" fill="#f7df1e" filter="url(#glow)" opacity=".12"/><circle cx="1020" cy="110" r="140" fill="#3178c6" filter="url(#glow)" opacity=".18"/></g><g class="particle-2"><circle cx="600" cy="310" r="150" fill="#f05032" filter="url(#glow)" opacity=".14"/><circle cx="920" cy="280" r="90" fill="#8b5cf6" filter="url(#glow)" opacity=".16"/></g><path fill="none" stroke="#3178c6" stroke-width="2" d="M 80 180 Q 300 90, 600 180 T 1120 180" class="stream-line" opacity=".35"/><path fill="none" stroke="#f7df1e" stroke-width="2" d="M 80 220 Q 400 310, 750 200 T 1120 160" class="stream-line" opacity=".3" style="animation-duration:3.5s"/><circle cx="1080" cy="90" r="45" fill="none" stroke="#3178c6" stroke-width="1.5" class="pulse-glow"/><circle cx="120" cy="270" r="35" fill="none" stroke="#f7df1e" stroke-width="1.5" class="pulse-glow"/><g text-anchor="middle"><text class="title-text" transform="translate(600, 125)">Awesome <tspan class="title-highlight">JavaScript</tspan> Compilers</text><text y="50" class="subtitle-text" transform="translate(600, 125)">The Curated Guide to Modern Transpilers, Native Toolchains &amp; Ultra-Fast Bundlers</text><g><g transform="translate(600, 125) translate(0, 105) translate(-360, 0)"><rect width="120" height="36" x="-60" y="-18" fill="url(#badgeGrad)" stroke="#f5da55" stroke-opacity=".4" stroke-width="1.5" rx="18"/><text y="5" class="badge-label" text-anchor="middle">⚡ Babel</text></g><g transform="translate(600, 125) translate(0, 105) translate(-215, 0)"><rect width="120" height="36" x="-60" y="-18" fill="url(#badgeGrad)" stroke="#e43716" stroke-opacity=".4" stroke-width="1.5" rx="18"/><text y="5" class="badge-label" text-anchor="middle">🦀 SWC (Rust)</text></g><g transform="translate(600, 125) translate(0, 105) translate(-70, 0)"><rect width="120" height="36" x="-60" y="-18" fill="url(#badgeGrad)" stroke="#ffcf00" stroke-opacity=".4" stroke-width="1.5" rx="18"/><text y="5" class="badge-label" text-anchor="middle">🐹 esbuild (Go)</text></g><g transform="translate(600, 125) translate(0, 105) translate(75, 0)"><rect width="120" height="36" x="-60" y="-18" fill="url(#badgeGrad)" stroke="#3178c6" stroke-opacity=".4" stroke-width="1.5" rx="18"/><text y="5" class="badge-label" text-anchor="middle">🔷 TypeScript</text></g><g transform="translate(600, 125) translate(0, 105) translate(225, 0)"><rect width="130" height="36" x="-65" y="-18" fill="url(#badgeGrad)" stroke="#bd34fe" stroke-opacity=".4" stroke-width="1.5" rx="18"/><text y="5" class="badge-label" text-anchor="middle">⚡ Vite &amp; Rolldown</text></g><g transform="translate(600, 125) translate(0, 105) translate(375, 0)"><rect width="120" height="36" x="-60" y="-18" fill="url(#badgeGrad)" stroke="#52bd95" stroke-opacity=".4" stroke-width="1.5" rx="18"/><text y="5" class="badge-label" text-anchor="middle">🚀 Oxc &amp; Rspack</text></g></g></g><rect width="1200" height="6" x="0" y="354" fill="url(#primaryGlow)" rx="3"/></svg>